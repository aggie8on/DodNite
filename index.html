<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DodNite</title>
<meta name="application-name" content="DodNite">
<meta name="apple-mobile-web-app-title" content="DodNite">
<meta property="og:title" content="DodNite">
<meta name="twitter:title" content="DodNite">
<link rel="stylesheet" href="./style.css">
<script type="importmap">
{ "imports": {
  "three": "./vendor/three/three.module.js",
  "three/addons/": "./vendor/three/addons/"
} }
</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div>
<script>
window.__dodnitePeerReady = new Promise((resolve, reject) => {
  const load = (src, fallback = false) => {
    const s = document.createElement('script');
    s.src = src;
    s.async = false;
    s.onload = () => {
      if (typeof window.Peer === 'function') resolve();
      else if (!fallback) load('https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js', true);
      else reject(new Error('PeerJS loaded but did not expose the Peer client'));
    };
    s.onerror = () => {
      if (!fallback) load('https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js', true);
      else reject(new Error('PeerJS client failed to load'));
    };
    document.head.appendChild(s);
  };
  load('./vendor/peerjs/peerjs.min.js');
});
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
