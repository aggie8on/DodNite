<!doctype html>
<html>
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>DodNite</title></head>
<body>
<div id="hud">
  <div class="top">
    <span>WAVE <b id="wave">1</b></span>
    <span>SCORE <b id="score">0</b></span>
    <span>HP <b id="hp">100</b></span>
  </div>
  <div id="crosshair">+</div>
  <div id="message"></div>
  <div id="weaponBox"><div id="weapon">RIFLE</div><div id="ammo">READY</div></div>
  <div id="hint">WASD MOVE · SHIFT SPRINT · SPACE DOUBLE JUMP · C SLIDE · F AIR DASH · 1–5 WEAPONS · LMB FIRE · ESC UNLOCK</div>
</div>
<div id="start">
  <h1>DODNITE</h1>
  <p>Abandoned city. Endless waves.</p>
  <div class="sub">FAST FPS · DOODLE COMBAT · SURVIVE</div>
  <button id="play">PLAY</button>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
